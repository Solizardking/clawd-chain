[package]
name = "clawd_money"
version = "0.1.0"
edition = "2021"
description = "Clawd Chain prototype: stake-weighted oracle, flash cSOL credit with profit tax, lockup tenors"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.1.21"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
borsh = { version = "1", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
