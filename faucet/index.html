<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>clawd faucet: free CLAWD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦞%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#07060d;--line:#2a2346;--txt:#e9e6ff;--dim:#8c86b3;--red:#ff3b5c;--org:#ff8a3d;--cy:#2ef2ff;--grn:#3dffa8;--pur:#a259ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow-x:hidden}
canvas#bg,canvas#fx{position:fixed;inset:0;width:100%;height:100%}canvas#fx{pointer-events:none;z-index:10}
nav{position:relative;z-index:2;display:flex;gap:22px;align-items:center;padding:14px 28px}nav b{font-size:20px;flex:1}nav a{color:var(--dim);font-weight:600;text-decoration:none}nav a:hover{color:var(--txt)}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:10px 20px 60px}
.crab{width:230px;height:230px;margin-top:6px;filter:drop-shadow(0 0 30px #ff3b5c88)}
.crab .clL{transform-origin:40px 110px;animation:snapL 1.6s ease-in-out infinite}.crab .clR{transform-origin:160px 110px;animation:snapR 1.6s ease-in-out infinite}
@keyframes snapL{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}@keyframes snapR{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.crab .body{animation:bob 3s ease-in-out infinite;transform-origin:center}@keyframes bob{50%{transform:translateY(-8px)}}
.crab .ant{animation:wig 2s ease-in-out infinite;transform-origin:100px 70px}@keyframes wig{50%{transform:rotate(6deg)}}
.working .crab .clL,.working .crab .clR{animation-duration:.25s}.working .crab{animation:shake .15s infinite}@keyframes shake{50%{transform:translateX(2px)}}
h1{font-size:58px;margin:4px 0 0;font-weight:900;letter-spacing:-1px;text-align:center;background:linear-gradient(90deg,var(--red),var(--org),#ffd23d,var(--cy),var(--pur),var(--red));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
@keyframes hue{to{background-position:300%}}
.tag{color:var(--dim);margin:6px 0 24px;text-align:center}
.box{width:min(560px,100%);background:#120f22d9;border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(10px);box-shadow:0 0 60px #ff3b5c22,0 30px 80px #000a;position:relative;overflow:hidden}
.box:before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;background:conic-gradient(from var(--a,0deg),var(--red),var(--cy),var(--pur),var(--red));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 4s linear infinite;opacity:.7}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
input{width:100%;background:#0a0914;border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:15px;font:14px ui-monospace,Menlo,monospace;outline:none}input:focus{border-color:var(--cy);box-shadow:0 0 0 4px #2ef2ff22}
button{margin-top:14px;width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:900;color:#140a10;cursor:pointer;background:linear-gradient(90deg,var(--red),var(--org));box-shadow:0 0 30px #ff3b5c66;transition:.15s;letter-spacing:.5px}
button:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 44px #ff3b5caa}button:active{transform:scale(.98)}button:disabled{filter:grayscale(.6);cursor:wait;transform:none}
.prog{margin-top:16px;display:none}.working .prog,.done .prog{display:block}
.track{height:14px;border-radius:99px;background:#0a0914;border:1px solid var(--line);overflow:hidden}.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--cy) 0 12px,var(--pur) 12px 24px);background-size:34px 34px;animation:stripes .6s linear infinite;transition:width .2s;box-shadow:0 0 16px var(--cy)}
@keyframes stripes{to{background-position:34px 0}}
.meta{display:flex;justify-content:space-between;color:var(--dim);font:12px ui-monospace,Menlo,monospace;margin-top:6px}
.hash{font:12px ui-monospace,Menlo,monospace;color:#5fe9ff;opacity:.8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#out{margin-top:14px;min-height:22px;text-align:center;font-weight:700}#out a{color:var(--cy)}.okm{color:var(--grn)}.errm{color:var(--red)}
.rules{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.rules span{border:1px solid var(--line);background:#0d0b18cc;border-radius:99px;padding:6px 12px;color:var(--dim);font-size:13px}
.big{font-size:44px;font-weight:900;color:var(--grn);text-shadow:0 0 24px var(--grn);animation:pop .6s cubic-bezier(.2,2,.4,1)}@keyframes pop{from{transform:scale(.2);opacity:0}}
</style></head><body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<nav><b>🦞 clawd</b><a href="{{EXPLORER}}/">Home</a><a href="{{EXPLORER}}/explorer">Explorer</a><a href="https://github.com/Solizardking/clawd-chain">GitHub</a></nav>
<main id="main">
<svg class="crab" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
<g class="body"><g class="ant" stroke="#ff3b5c" stroke-width="4" stroke-linecap="round" fill="none"><path d="M88 66 Q70 30 50 20"/><path d="M112 66 Q130 30 150 20"/></g>
<g class="clL" fill="url(#g)"><path d="M62 112 L40 100"/><path d="M40 108c-28-6-36-40-14-58 6 10 16 14 24 12-6-12-2-24 8-30 14 18 8 52-18 76z"/></g>
<g class="clR" fill="url(#g)"><path d="M160 108c28-6 36-40 14-58-6 10-16 14-24 12 6-12 2-24-8-30-14 18-8 52 18 76z"/></g>
<g stroke="url(#g)" stroke-width="6" stroke-linecap="round"><path d="M70 120 L46 132M70 136 L46 152M74 150 L54 172M130 120 L154 132M130 136 L154 152M126 150 L146 172"/><path d="M62 112 L44 104M138 112 L156 104"/></g>
<ellipse cx="100" cy="128" rx="38" ry="46" fill="url(#g)"/><path d="M76 140h48M80 156h40" stroke="#c42245" stroke-width="3" stroke-linecap="round"/>
<circle cx="86" cy="104" r="10" fill="#07060d"/><circle cx="114" cy="104" r="10" fill="#07060d"/><circle cx="89" cy="101" r="3.5" fill="#2ef2ff"/><circle cx="117" cy="101" r="3.5" fill="#2ef2ff"/>
<path d="M90 122 Q100 130 110 122" stroke="#07060d" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>
<h1>clawd faucet</h1><div class="tag">Pinch some free <b>CLAWD</b> for the clawd chain. {{AMOUNT}} per wallet per day.</div>
<div class="box"><input id="addr" placeholder="Your clawd / Solana wallet address" autocomplete="off" spellcheck="false">
<button id="go">🦞 Pinch {{AMOUNT}} CLAWD</button>
<div class="prog"><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span id="phase">mining proof of work…</span><span id="rate"></span></div><div class="hash" id="hash"></div></div>
<div id="out"></div></div>
<div class="rules"><span>⛏️ {{BITS}}-bit proof of work</span><span>👛 {{AMOUNT}} CLAWD / wallet / 24h</span><span>🌐 10 CLAWD / IP / 24h</span><span>🧪 testnet coins, no value</span></div>
</main>
<script>
// ---- background: bubbles + drifting tiny lobsters ----
const bg=document.getElementById('bg'),fx=document.getElementById('fx'),c=bg.getContext('2d'),f=fx.getContext('2d');let W,H;
function size(){W=bg.width=fx.width=innerWidth*devicePixelRatio;H=bg.height=fx.height=innerHeight*devicePixelRatio}size();onresize=size;
const R=Math.random,dp=devicePixelRatio;let speed=1;
const bubs=Array.from({length:70},()=>({x:R(),y:R(),r:2+R()*7,v:.0004+R()*.0012,w:R()*6}));
const crit=Array.from({length:7},()=>({x:R(),y:R(),s:.5+R()*.8,v:(R()<.5?-1:1)*(.0003+R()*.0005),p:R()*6}));
function lob(x,y,s,dir,t){c.save();c.translate(x,y);c.scale(s*dir*dp,s*dp);c.globalAlpha=.22;c.fillStyle='#ff3b5c';c.strokeStyle='#ff3b5c';c.lineWidth=3;
 c.beginPath();c.ellipse(0,0,24,12,0,0,7);c.fill();c.beginPath();c.ellipse(-30,0,10,7,0,0,7);c.fill();
 const k=Math.sin(t*6)*.3;for(const sy of[-1,1]){c.save();c.translate(22,sy*6);c.rotate(sy*(.4+k));c.beginPath();c.moveTo(0,0);c.lineTo(18,0);c.stroke();c.beginPath();c.ellipse(26,0,9,6,0,0,7);c.fill();c.restore()}
 for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(i*8,8);c.lineTo(i*8-4,16+Math.sin(t*10+i)*3);c.stroke()}c.restore()}
function draw(t){t/=1000;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0618');g.addColorStop(.6,'#07060d');g.addColorStop(1,'#140712');c.fillStyle=g;c.fillRect(0,0,W,H);
 for(let i=0;i<3;i++){c.beginPath();c.strokeStyle=['#ff3b5c22','#2ef2ff1c','#a259ff22'][i];c.lineWidth=2*dp;for(let x=0;x<=W;x+=20){const y=H*(.75+i*.07)+Math.sin(x/(180+i*40)+t*(.6+i*.2)*speed)*24*dp;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
 for(const k of crit){k.x+=k.v*speed;if(k.x>1.1)k.x=-.1;if(k.x<-.1)k.x=1.1;lob(k.x*W,(k.y*.8+.1)*H+Math.sin(t+k.p)*20*dp,k.s,Math.sign(k.v),t*speed)}
 for(const b of bubs){b.y-=b.v*speed;if(b.y<-.05){b.y=1.05;b.x=R()}c.beginPath();c.arc((b.x+Math.sin(t+b.w)*.01)*W,b.y*H,b.r*dp,0,7);c.strokeStyle='#7fe8ff55';c.lineWidth=1.2*dp;c.stroke()}
 fxDraw();requestAnimationFrame(draw)}
// ---- fx: coins + confetti ----
let parts=[];
function burst(){const cols=['#ff3b5c','#ff8a3d','#ffd23d','#2ef2ff','#a259ff','#3dffa8'];
 for(let i=0;i<160;i++)parts.push({t:'c',x:W/2,y:H*.45,vx:(R()-.5)*26*dp,vy:(-R()*22-6)*dp,r:R()*6,vr:(R()-.5)*.4,col:cols[i%6],l:200});
 for(let i=0;i<40;i++)parts.push({t:'o',x:R()*W,y:-R()*H*.6,vx:(R()-.5)*2,vy:(4+R()*6)*dp,r:0,vr:.1+R()*.1,l:400})}
function fxDraw(){f.clearRect(0,0,W,H);parts=parts.filter(p=>p.l-->0&&p.y<H+60);for(const p of parts){p.vy+=.45*dp;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;f.save();f.translate(p.x,p.y);
 if(p.t==='c'){f.rotate(p.r);f.fillStyle=p.col;f.fillRect(-5*dp,-3*dp,10*dp,6*dp)}else{f.scale(Math.cos(p.r*3),1);const s=18*dp;const gg=f.createRadialGradient(-s/3,-s/3,1,0,0,s);gg.addColorStop(0,'#fff6a8');gg.addColorStop(.5,'#ffc23d');gg.addColorStop(1,'#d9760c');f.fillStyle=gg;f.beginPath();f.arc(0,0,s,0,7);f.fill();f.fillStyle='#8a3b07';f.font=`900 ${s}px sans-serif`;f.textAlign='center';f.textBaseline='middle';f.fillText('C',0,1)}f.restore()}}
requestAnimationFrame(draw);
// ---- faucet logic (unchanged protocol: /challenge + PoW + /airdrop) ----
const $=id=>document.getElementById(id),main=$('main'),out=$('out');
async function sha(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
function lz(b){let n=0;for(const x of b){if(x===0){n+=8;continue}n+=Math.clz32(x)-24;break}return n}
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
$('go').onclick=async()=>{const address=$('addr').value.trim();out.className='';
 if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address)){out.className='errm';out.textContent='That does not look like a wallet address 🦀';return}
 $('go').disabled=true;main.className='working';speed=4;out.textContent='';$('phase').textContent='mining proof of work…';
 try{const {challenge,bits}=await (await fetch('/challenge')).json();const exp=2**bits,t0=performance.now();let nonce=0,h,best=0;
  while(true){h=await sha(challenge+':'+nonce);const z=lz(h);if(z>best)best=z;if(z>=bits)break;nonce++;
   if(nonce%400===0){const pct=100*(1-Math.exp(-nonce/exp));$('fill').style.width=pct.toFixed(1)+'%';$('rate').textContent=Math.round(nonce/((performance.now()-t0)/1000)).toLocaleString()+' H/s · best '+best+'/'+bits+' bits';$('hash').textContent=hex(h);await new Promise(r=>setTimeout(r))}}
  $('fill').style.width='100%';$('hash').textContent=hex(h);$('phase').textContent='proof found! sending CLAWD…';
  const r=await (await fetch('/airdrop',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,challenge,nonce})})).json();
  if(r.signature){main.className='done';burst();out.className='okm';out.innerHTML=`<div class="big">+${r.amount} CLAWD</div>landed in your wallet 🦞<br><a href="{{EXPLORER}}/tx/${r.signature}" target="_blank">view transaction ↗</a> · <a href="{{EXPLORER}}/address/${address}" target="_blank">view wallet ↗</a>`;$('phase').textContent='done'}
  else{main.className='';out.className='errm';out.textContent=r.error||'faucet error'}}
 catch(e){main.className='';out.className='errm';out.textContent='Network error, try again'}
 speed=1;$('go').disabled=false};
</script></body></html>
