app = "clawd-chain-faucet"
primary_region = "iad"
[build]
  dockerfile = "../../faucet/Dockerfile"
[env]
  PORT = "8080"
  VALIDATOR_RPC = "https://clawd-chain-validator.fly.dev"
  PUBLIC_RPC = "https://clawd-chain-validator.fly.dev"
  FAUCET_URL = "https://clawd-chain-faucet.fly.dev"
  FAUCET_INTERNAL = "https://clawd-chain-faucet.fly.dev"
  EXPLORER_URL = "https://clawd-chain-explorer.fly.dev"
  SITE_URL = "https://clawd-chain-explorer.fly.dev"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
