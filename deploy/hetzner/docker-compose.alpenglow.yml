# Overlay: Agave 4.3.2 + Alpenglow at genesis. Uses a NEW ledger volume so the current chain is untouched
# (rollback = drop this overlay). FAUCET_PUBKEY funds the faucet at genesis.
services:
  validator:
    build: { context: ../.., dockerfile: deploy/alpenglow/Dockerfile }
    image: clawd-chain-validator-alpenglow
    # Agave 4.3 asserts io_uring support at start; Docker's default seccomp profile blocks it
    # (panic: assertion failed: io_uring_supported()). Verified on this host 2026-10-22.
    security_opt: ["seccomp=unconfined"]
    volumes: !override ["clawd-ledger-alpenglow:/data"]
    environment:
      FAUCET_PUBKEY: ${FAUCET_PUBKEY}
      LEDGER_RESET_TOKEN: ${LEDGER_RESET_TOKEN:-alpenglow-1}
volumes:
  clawd-ledger-alpenglow: { name: clawd-ledger-alpenglow }
