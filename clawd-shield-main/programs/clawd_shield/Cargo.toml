[package]
name = "clawd_shield"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "clawd_shield"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
[dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
solana-poseidon = "2.2"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = "2.2"
